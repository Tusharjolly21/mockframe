<!doctype html>
<html><head><meta charset="utf-8">
<link rel="stylesheet" href="../lib/base.css"><link rel="stylesheet" href="app.css">
<script src="../lib/icons.js"></script><script src="../lib/base.js"></script>
<style>
  :root { --chrome: #16161d; }
  body { background: radial-gradient(circle at 20% 10%, #ffd8c2, transparent 45%), radial-gradient(circle at 90% 40%, #d9ccff, transparent 50%), radial-gradient(circle at 30% 90%, #bfeedb, transparent 50%), linear-gradient(160deg, #f6c7b4, #b8a6f0 55%, #8fd3c1); }
  .home .x { display: none; }
  .wg { border-radius: 26px; background: rgba(255,255,255,.88); backdrop-filter: blur(20px); box-shadow: 0 10px 30px rgba(60,40,90,.12); padding: 14px; }
  .apps { display: grid; grid-template-columns: repeat(4, 1fr); gap: 18px 0; margin: 22px 22px 0; }
  .apps div { display: flex; flex-direction: column; align-items: center; gap: 6px; font-size: 11.5px; font-weight: 600; color: #2a2433; }
  .apps span { width: 62px; height: 62px; border-radius: 16px; display: grid; place-items: center; color: #fff; box-shadow: 0 4px 12px rgba(0,0,0,.12); }
  .dock { position: absolute; left: 12px; right: 12px; bottom: 22px; height: 92px; border-radius: 34px; background: rgba(255,255,255,.35); backdrop-filter: blur(20px); display: flex; justify-content: space-around; align-items: center; }
  .dock span { width: 62px; height: 62px; border-radius: 16px; display: grid; place-items: center; color: #fff; }
  .mini { display: flex; gap: 7px; margin-top: 10px; }
  .mini i { flex: 1; height: 28px; border-radius: 9px; display: block; }
</style></head><body>
<div class="screen" style="padding:14px 22px 0">
  <div class="wg">
    <div class="row between"><div class="row" style="gap:8px"><div style="width:26px;height:26px;border-radius:8px;background:#16161d;color:#fff;display:grid;place-items:center"><i data-i="sprout" style="font-size:15px"></i></div><b style="font-family:Sora;font-size:14px;letter-spacing:-.02em">Today</b></div><span class="muted" style="font-size:12px;font-weight:600">4 of 6 done</span></div>
    <div class="row" style="gap:14px;margin-top:12px">
      <div style="position:relative;width:96px;height:96px;flex-shrink:0"><svg viewBox="0 0 96 96" width="96" height="96" style="transform:rotate(-90deg)"><circle cx="48" cy="48" r="40" fill="none" stroke="#efe9f8" stroke-width="11"/><circle cx="48" cy="48" r="40" fill="none" stroke="#34c38f" stroke-width="11" stroke-linecap="round" stroke-dasharray="168 252"/></svg><div class="num" style="position:absolute;inset:0;display:grid;place-items:center;font-size:22px">67%</div></div>
      <div class="grow" style="display:flex;flex-direction:column;gap:7px;font-size:13px;font-weight:600">
        <div class="row" style="gap:8px"><i data-i="circle-check" style="font-size:17px;color:#34c38f"></i>Morning walk</div>
        <div class="row" style="gap:8px"><i data-i="circle-check" style="font-size:17px;color:#34c38f"></i>Read 20 pages</div>
        <div class="row" style="gap:8px;color:var(--sub)"><i data-i="circle-dot" style="font-size:17px"></i>Meditate</div>
        <div class="row" style="gap:8px;color:var(--sub)"><i data-i="circle-dot" style="font-size:17px"></i>Phone down by 10:30</div>
      </div>
    </div>
  </div>
  <div class="row" style="gap:14px;margin-top:14px">
    <div class="wg" style="flex:1;height:158px;background:linear-gradient(160deg,#ffb27a,#ff6a3d);color:#fff">
      <i data-i="flame" style="font-size:26px"></i><div class="num" style="font-size:36px;margin-top:12px">32</div><div style="font-size:12.5px;font-weight:650;opacity:.9">day walk streak</div>
    </div>
    <div class="wg" style="flex:1;height:158px">
      <div class="row" style="gap:6px;font-size:12px;font-weight:700"><i data-i="droplet" style="font-size:15px;color:#1d6fd1"></i>Water</div>
      <div class="num" style="font-size:30px;margin-top:10px">6<span class="muted" style="font-size:15px"> / 8</span></div>
      <div class="mini"><i style="background:#4f9ef0"></i><i style="background:#4f9ef0"></i><i style="background:#4f9ef0"></i><i style="background:#c9e4ff"></i></div>
      <div class="mini" style="margin-top:6px"><i style="background:#4f9ef0"></i><i style="background:#4f9ef0"></i><i style="background:#4f9ef0"></i><i style="background:#c9e4ff"></i></div>
    </div>
  </div>
  <div class="apps" style="margin:22px 0 0">
    <div><span style="background:linear-gradient(160deg,#5eead4,#0d9488)"><i data-i="calendar" style="font-size:28px"></i></span>Calendar</div>
    <div><span style="background:linear-gradient(160deg,#fda4af,#e11d48)"><i data-i="music" style="font-size:28px"></i></span>Music</div>
    <div><span style="background:linear-gradient(160deg,#93c5fd,#2563eb)"><i data-i="camera" style="font-size:28px"></i></span>Camera</div>
    <div><span style="background:#16161d"><i data-i="sprout" style="font-size:28px"></i></span>Habitat</div>
    <div><span style="background:linear-gradient(160deg,#fde68a,#f59e0b)"><i data-i="sun" style="font-size:28px"></i></span>Weather</div>
    <div><span style="background:linear-gradient(160deg,#c4b5fd,#7c3aed)"><i data-i="book-open" style="font-size:28px"></i></span>Books</div>
    <div><span style="background:linear-gradient(160deg,#86efac,#16a34a)"><i data-i="map-pin" style="font-size:28px"></i></span>Maps</div>
    <div><span style="background:linear-gradient(160deg,#cbd5e1,#64748b)"><i data-i="settings" style="font-size:28px"></i></span>Settings</div>
  </div>
</div>
<div class="dock"><span style="background:linear-gradient(160deg,#86efac,#16a34a)"><i data-i="phone" style="font-size:28px"></i></span><span style="background:linear-gradient(160deg,#7dd3fc,#0284c7)"><i data-i="compass" style="font-size:28px"></i></span><span style="background:linear-gradient(160deg,#86efac,#22c55e)"><i data-i="message-circle" style="font-size:28px"></i></span><span style="background:linear-gradient(160deg,#fca5a5,#ef4444)"><i data-i="mail" style="font-size:28px"></i></span></div>
</body></html>
