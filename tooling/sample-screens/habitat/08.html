<!doctype html>
<html><head><meta charset="utf-8">
<link rel="stylesheet" href="../lib/base.css"><link rel="stylesheet" href="app.css">
<script src="../lib/icons.js"></script><script src="../lib/base.js"></script>
<style>
  :root { --bg: #111117; --card: #1c1c24; --ink: #f4f3f7; --sub: #9a98a3; --faint: #5f5d68; --line: rgba(255,255,255,.08); --chrome: #ffffff; --tab-bg: rgba(22,22,29,.94);
    --mint: #1e3b31; --sky: #1d2f45; --lilac: #2c2545; --peach: #3d2a21; --butter: #3a3220; --rose: #3d2328; }
  .hb .em { background: rgba(255,255,255,.07); }
  .hb .s { color: rgba(244,243,247,.6); }
  .ck.done { background: #f4f3f7; color: #111117; }
  .ck.todo { border-color: rgba(255,255,255,.25); }
  .week .on { background: #f4f3f7; color: rgba(17,17,23,.6); } .week .on b { color: #111117; }
  .tabs { --accent: #f4f3f7; }
  .ck[style*="conic"] > div { background: var(--sky) !important; }
  .hb i[style*="color:#13795b"] { color: #6ee7b7 !important; } .hb i[style*="color:#1d6fd1"] { color: #7cb8ff !important; } .hb i[style*="color:#6d4ad6"] { color: #b9a4ff !important; }
  .hb i[style*="color:#c2410c"] { color: #ffb08a !important; } .hb i[style*="color:#a16207"] { color: #f6cf62 !important; } .hb i[style*="color:#be3455"] { color: #ff9aad !important; }
</style>
</head><body>
<div class="screen">
  <div class="nav"><div><div class="eyebrow">Wednesday, 21 October</div><div class="h1" style="margin-top:2px">Today</div></div>
    <div style="position:relative;width:52px;height:52px"><svg viewBox="0 0 52 52" width="52" height="52" style="transform:rotate(-90deg)"><circle cx="26" cy="26" r="21" fill="none" stroke="var(--line)" stroke-width="6"/><circle cx="26" cy="26" r="21" fill="none" stroke="#34c38f" stroke-width="6" stroke-linecap="round" stroke-dasharray="88 132"/></svg><div class="num" style="position:absolute;inset:0;display:grid;place-items:center;font-size:12.5px">4/6</div></div></div>
  <div class="week" style="margin-top:10px"><div>M<b>19</b><div class="dot"></div></div><div>T<b>20</b><div class="dot"></div></div><div class="on">W<b>21</b><div class="dot" style="background:#7ee0b5"></div></div><div>T<b>22</b><div class="dot" style="background:transparent"></div></div><div>F<b>23</b><div class="dot" style="background:transparent"></div></div><div>S<b>24</b><div class="dot" style="background:transparent"></div></div><div>S<b>25</b><div class="dot" style="background:transparent"></div></div></div>
  <div class="hb" style="background:var(--mint)"><div class="em"><i data-i="footprints" style="font-size:21px;color:#13795b"></i></div><div class="grow"><div class="t">Morning walk</div><div class="s"><i data-i="flame" style="font-size:12px;color:#ea580c"></i> 32 days · 6,000 steps</div></div><div class="ck done"><i data-i="check" style="font-size:17px" data-s="3"></i></div></div>
  <div class="hb" style="background:var(--sky)"><div class="em"><i data-i="droplet" style="font-size:21px;color:#1d6fd1"></i></div><div class="grow"><div class="t">Drink water</div><div class="s">6 of 8 glasses</div></div><div class="ck" style="background:conic-gradient(#1d6fd1 0 75%, rgba(22,22,29,.12) 0);padding:3px"><div style="width:100%;height:100%;border-radius:50%;background:var(--sky)"></div></div></div>
  <div class="hb" style="background:var(--lilac)"><div class="em"><i data-i="book-open" style="font-size:21px;color:#6d4ad6"></i></div><div class="grow"><div class="t">Read 20 pages</div><div class="s"><i data-i="flame" style="font-size:12px;color:#ea580c"></i> 12 days</div></div><div class="ck done"><i data-i="check" style="font-size:17px" data-s="3"></i></div></div>
  <div class="hb" style="background:var(--peach)"><div class="em"><i data-i="brain" style="font-size:21px;color:#c2410c"></i></div><div class="grow"><div class="t">Meditate</div><div class="s">10 min · after lunch</div></div><div class="ck todo"></div></div>
  <div class="hb" style="background:var(--butter)"><div class="em"><i data-i="languages" style="font-size:21px;color:#a16207"></i></div><div class="grow"><div class="t">Spanish practice</div><div class="s"><i data-i="flame" style="font-size:12px;color:#ea580c"></i> 8 days · 15 min</div></div><div class="ck done"><i data-i="check" style="font-size:17px" data-s="3"></i></div></div>
  <div class="hb" style="background:var(--rose)"><div class="em"><i data-i="moon" style="font-size:21px;color:#be3455"></i></div><div class="grow"><div class="t">Phone down by 10:30</div><div class="s">Tonight</div></div><div class="ck todo"></div></div>
</div>
<div class="tabs"><div class="on"><i data-i="circle-check"></i>Today</div><div><i data-i="layout-grid"></i>Habits</div><div><i data-i="chart-column"></i>Stats</div><div><i data-i="user"></i>Me</div></div>
<script>document.addEventListener("DOMContentLoaded",()=>{document.querySelectorAll('.hb svg').forEach(s=>{const c=s.getAttribute('style')||'';const m={"#13795b":"#6ee7b7","#1d6fd1":"#7cb8ff","#6d4ad6":"#b9a4ff","#c2410c":"#ffb08a","#a16207":"#f6cf62","#be3455":"#ff9aad"};for(const k in m) if(c.includes(k)) s.style.color=m[k];});document.querySelector('.ck[style*="conic"]').style.background='conic-gradient(#7cb8ff 0 75%, rgba(255,255,255,.14) 0)';});</script>
</body></html>
