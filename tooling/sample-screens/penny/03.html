<!doctype html>
<html><head><meta charset="utf-8">
<link rel="stylesheet" href="../lib/base.css"><link rel="stylesheet" href="app.css">
<script src="../lib/icons.js"></script><script src="../lib/base.js"></script>
<style>
  /* the card art spans y 110–350 in page px: storeSets lifts it out */
  .pcard { position: absolute; top: calc(var(--bar) + 66px); left: 26px; right: 26px; height: 220px; border-radius: 22px; padding: 20px 22px; color: #fff; overflow: hidden;
    background: radial-gradient(circle at 85% 0%, rgba(126,240,200,.55), transparent 45%), radial-gradient(circle at 0% 100%, rgba(20,184,146,.6), transparent 55%), linear-gradient(140deg, #0f4f52, #0b2733);
    box-shadow: 0 18px 40px rgba(11,59,63,.35); }
  .pcard .chipc { width: 40px; height: 30px; border-radius: 7px; background: linear-gradient(135deg, #f6e7b0, #c9a95a); }
  .ctl { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; margin: 0 16px; }
  .ctl div { display: flex; flex-direction: column; align-items: center; gap: 6px; font-size: 12px; font-weight: 600; }
  .ctl span { width: 52px; height: 52px; border-radius: 50%; background: #fff; display: grid; place-items: center; box-shadow: 0 1px 2px rgba(0,0,0,.04), 0 6px 18px rgba(0,0,0,.05); }
  .tg { width: 46px; height: 28px; border-radius: 99px; background: var(--accent); position: relative; }
  .tg::after { content: ""; position: absolute; right: 3px; top: 3px; width: 22px; height: 22px; border-radius: 50%; background: #fff; }
  .tg.off { background: #d9dfdd; } .tg.off::after { right: auto; left: 3px; }
  .set { display: flex; align-items: center; gap: 12px; padding: 12px 0; }
  .set + .set { border-top: 1px solid var(--line); }
</style></head>
<body>
<div class="screen"><div class="nav"><div class="iconbtn"><i data-i="chevron-left" style="font-size:20px"></i></div><div class="title">Your card</div><div class="iconbtn"><i data-i="ellipsis" style="font-size:18px"></i></div></div></div>
<div class="pcard">
  <div class="row between"><span style="font-family:Manrope;font-weight:800;font-size:20px;letter-spacing:-.02em">penny</span><i data-i="wifi" style="font-size:22px;transform:rotate(90deg);opacity:.85"></i></div>
  <div class="chipc" style="margin-top:22px"></div>
  <div style="font-family:Manrope;font-size:19px;font-weight:700;letter-spacing:.14em;margin-top:18px">•••• •••• •••• 4821</div>
  <div class="row between" style="margin-top:14px;font-size:12px;font-weight:600"><div><div style="opacity:.65;font-size:10.5px">CARDHOLDER</div>MAYA ALVAREZ</div><div><div style="opacity:.65;font-size:10.5px">EXPIRES</div>09/29</div><svg width="44" height="28" viewBox="0 0 44 28"><circle cx="15" cy="14" r="13" fill="#ff5f3a" opacity=".95"/><circle cx="29" cy="14" r="13" fill="#ffb21e" opacity=".9"/></svg></div>
</div>
<div class="screen" style="top:calc(var(--bar) + 306px)">
  <div class="ctl"><div><span><i data-i="snowflake" style="font-size:21px;color:#0284c7"></i></span>Freeze</div><div><span><i data-i="lock" style="font-size:20px"></i></span>Show PIN</div><div><span><i data-i="sliders-horizontal" style="font-size:20px"></i></span>Limits</div><div><span><i data-i="copy" style="font-size:20px"></i></span>Details</div></div>
  <div class="card" style="margin:16px 16px 0;padding:14px 16px">
    <div class="row between"><div style="font-weight:650">Monthly limit</div><div class="amt">€1,240 <span class="muted" style="font-weight:600;font-size:13px">/ €2,000</span></div></div>
    <div class="track" style="margin-top:10px;height:8px"><i style="width:62%"></i></div>
  </div>
  <div class="card" style="margin:12px 16px 0;padding:2px 16px">
    <div class="set"><div class="ico" style="background:var(--mint);color:var(--accent)"><i data-i="smartphone" style="font-size:19px"></i></div><div class="grow"><div style="font-weight:650;font-size:14.5px">Online payments</div><div class="muted" style="font-size:12px">Shops, apps and subscriptions</div></div><div class="tg"></div></div>
    <div class="set"><div class="ico" style="background:#e0f4fe;color:#0284c7"><i data-i="wifi" style="font-size:19px;transform:rotate(90deg)"></i></div><div class="grow"><div style="font-weight:650;font-size:14.5px">Contactless</div><div class="muted" style="font-size:12px">Tap to pay up to €50</div></div><div class="tg"></div></div>
    <div class="set"><div class="ico" style="background:#fff3dc;color:#d97706"><i data-i="plane" style="font-size:19px"></i></div><div class="grow"><div style="font-weight:650;font-size:14.5px">Payments abroad</div><div class="muted" style="font-size:12px">No fees in 150+ currencies</div></div><div class="tg off"></div></div>
  </div>
</div>
<div class="tabs"><div><i data-i="house"></i>Home</div><div><i data-i="chart-pie"></i>Spending</div><div class="on"><i data-i="credit-card"></i>Cards</div><div><i data-i="piggy-bank"></i>Savings</div><div><i data-i="user"></i>Profile</div></div>
</body></html>
