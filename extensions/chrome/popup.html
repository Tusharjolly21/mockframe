<!doctype html>
<html lang="en">
  <head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>MockFrame Capture</title><link rel="stylesheet" href="popup.css"></head>
  <body>
    <main>
      <header><span class="mark">#</span><div><strong>MockFrame</strong><small>Capture to editor</small></div></header>

    <script src="popup.js"></script>
