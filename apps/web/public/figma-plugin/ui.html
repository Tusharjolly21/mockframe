<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<style>
  :root {
    --bg: var(--figma-color-bg, #ffffff);
    --bg2: var(--figma-color-bg-secondary, #f5f5f5);
    --text: var(--figma-color-text, #1e1e1e);
    --muted: var(--figma-color-text-secondary, #6b6b6b);
    --border: var(--figma-color-border, #e6e6e6);
    --accent: #6d4aff;
    --accent-text: #ffffff;
    --danger: var(--figma-color-text-danger, #d6303a);
  }
  * { box-sizing: border-box; }
  body { margin: 0; font: 12px/1.45 Inter, system-ui, sans-serif; color: var(--text); background: var(--bg); }
  main { display: flex; flex-direction: column; height: 100vh; }
  header { padding: 14px 16px 10px; border-bottom: 1px solid var(--border); }
  h1 { margin: 0; font-size: 13px; font-weight: 600; }
  header p { margin: 2px 0 0; color: var(--muted); }
  .list { flex: 1; overflow-y: auto; padding: 12px 16px; }
  .grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
  .frame { min-width: 0; }
  .frame .thumb { height: 92px; border-radius: 6px; background: var(--bg2); display: grid; place-items: center; overflow: hidden; border: 1px solid var(--border); }
  .frame img { max-width: 100%; max-height: 100%; display: block; }
  .frame .name { margin-top: 4px; font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .frame .size { color: var(--muted); font-size: 11px; font-variant-numeric: tabular-nums; }
  .empty { height: 100%; display: grid; place-items: center; text-align: center; color: var(--muted); padding: 24px; }
  .empty strong { display: block; color: var(--text); font-size: 13px; margin-bottom: 4px; }
  .more { margin-top: 10px; color: var(--muted); }
  footer { border-top: 1px solid var(--border); padding: 12px 16px 14px; display: grid; gap: 10px; }
  .row { display: grid; grid-template-columns: 64px 1fr; align-items: center; gap: 8px; }
  .row > span { color: var(--muted); }
  .seg { display: flex; background: var(--bg2); border-radius: 6px; padding: 2px; }
  .seg button { flex: 1; border: 0; background: transparent; color: var(--muted); font: inherit; padding: 5px 6px; border-radius: 5px; cursor: pointer; }
  .seg button[aria-pressed="true"] { background: var(--bg); color: var(--text); font-weight: 600; box-shadow: 0 0 0 1px var(--border); }
  select { width: 100%; font: inherit; color: var(--text); background: var(--bg); border: 1px solid var(--border); border-radius: 6px; padding: 5px 6px; }
  .send { border: 0; border-radius: 6px; padding: 9px 12px; font: inherit; font-weight: 600; background: var(--accent); color: var(--accent-text); cursor: pointer; }
  .send:disabled { opacity: .45; cursor: default; }
  .status { min-height: 17px; color: var(--muted); }
  .status.error { color: var(--danger); }
  .status a { color: var(--accent); cursor: pointer; text-decoration: underline; }
  details { color: var(--muted); }
  details summary { cursor: pointer; }
  details label { display: flex; gap: 6px; align-items: center; margin-top: 6px; }
  [hidden] { display: none !important; }
</style>
</head>
<body>
<main>
  <header>
    <h1>Send to Mockframe</h1>
    <p>Put frames in a device, or turn them into a store listing set.</p>
  </header>

  <section class="list" id="list" aria-live="polite"></section>

  <footer>
    <div class="row">
      <span>Open as</span>
      <div class="seg" role="group" aria-label="Open as">
        <button type="button" data-mode="devices" aria-pressed="true">In devices</button>
        <button type="button" data-mode="set" aria-pressed="false">Store set</button>
      </div>
    </div>
    <div class="row" id="setRow" hidden>
      <span>Style</span>
      <select id="set" aria-label="Store set style">
        <option value="stride">Stride: bold gradients</option>
        <option value="penny">Penny: warm and friendly</option>
        <option value="hush">Hush: calm and dark</option>
        <option value="habitat">Habitat: soft pastels</option>
      </select>
    </div>
    <div class="row" id="platformRow" hidden>
      <span>Store</span>
      <div class="seg" role="group" aria-label="Store">
        <button type="button" data-platform="ios" aria-pressed="true">App Store</button>
        <button type="button" data-platform="android" aria-pressed="false">Google Play</button>
      </div>
    </div>
    <div class="row">
      <span>Quality</span>
      <div class="seg" role="group" aria-label="Export scale">
        <button type="button" data-scale="2" aria-pressed="true">2×</button>
        <button type="button" data-scale="1" aria-pressed="false">1×</button>
      </div>
    </div>
    <button type="button" class="send" id="send" disabled>Select frames to send</button>
    <div class="status" id="status" role="status"></div>
    <details>
      <summary>Developer</summary>
      <label><input type="checkbox" id="local" /> Send to localhost:3000</label>
    </details>
  </footer>
</main>

<script>
  const PROD = "https://mockframe.app";
  const LOCAL = "http://localhost:3000";
  const state = { frames: [], more: 0, mode: "devices", set: "stride", platform: "ios", scale: 2, local: false, busy: false, lastUrl: null };
  const $ = (id) => document.getElementById(id);
  const post = (msg) => parent.postMessage({ pluginMessage: msg }, "*");
  const urls = [];

  function savePrefs() {
    post({ type: "save-prefs", prefs: { mode: state.mode, set: state.set, platform: state.platform, scale: state.scale, local: state.local } });
  }

  function setStatus(text, error) {
    const el = $("status");
    el.textContent = text || "";
    el.className = error ? "status error" : "status";
  }

  function render() {
    urls.splice(0).forEach((u) => URL.revokeObjectURL(u));
    const list = $("list");
    if (!state.frames.length) {
      list.innerHTML = '<div class="empty"><div><strong>Select one or more frames</strong>Up to 8 at a time. Phone, tablet and desktop frames each go in a device that fits.</div></div>';
    } else {
      const grid = document.createElement("div");
      grid.className = "grid";
      for (const f of state.frames) {
        const el = document.createElement("div");
        el.className = "frame";
        const thumb = document.createElement("div");
        thumb.className = "thumb";
        if (f.thumb) {
          const img = document.createElement("img");
          const u = URL.createObjectURL(new Blob([f.thumb], { type: "image/png" }));
          urls.push(u);
          img.src = u;
          img.alt = "";
          thumb.appendChild(img);
        }
        const name = document.createElement("div");
        name.className = "name";
        name.textContent = f.name;
        const size = document.createElement("div");
        size.className = "size";
        size.textContent = f.width + " × " + f.height;
        el.append(thumb, name, size);
        grid.appendChild(el);
      }
      list.replaceChildren(grid);
      if (state.more) {
        const more = document.createElement("p");
        more.className = "more";
        more.textContent = "Only the first 8 are sent. " + state.more + " more selected.";
        list.appendChild(more);
      }
    }
    document.querySelectorAll("[data-mode]").forEach((b) => b.setAttribute("aria-pressed", String(b.dataset.mode === state.mode)));
    document.querySelectorAll("[data-platform]").forEach((b) => b.setAttribute("aria-pressed", String(b.dataset.platform === state.platform)));
    document.querySelectorAll("[data-scale]").forEach((b) => b.setAttribute("aria-pressed", String(Number(b.dataset.scale) === state.scale)));
    $("setRow").hidden = $("platformRow").hidden = state.mode !== "set";
    $("set").value = state.set;
    $("local").checked = state.local;
    const n = state.frames.length;
    const send = $("send");
    send.disabled = !n || state.busy;
    send.textContent = state.busy ? "Sending…" : !n ? "Select frames to send" : n === 1 ? "Send 1 frame to Mockframe" : "Send " + n + " frames to Mockframe";
  }

  document.querySelectorAll("[data-mode]").forEach((b) => b.addEventListener("click", () => { state.mode = b.dataset.mode; savePrefs(); render(); }));
  document.querySelectorAll("[data-platform]").forEach((b) => b.addEventListener("click", () => { state.platform = b.dataset.platform; savePrefs(); render(); }));
  document.querySelectorAll("[data-scale]").forEach((b) => b.addEventListener("click", () => { state.scale = Number(b.dataset.scale); savePrefs(); render(); }));
  $("set").addEventListener("change", (e) => { state.set = e.target.value; savePrefs(); });
  $("local").addEventListener("change", (e) => { state.local = e.target.checked; savePrefs(); });

  $("send").addEventListener("click", () => {
    if (!state.frames.length || state.busy) return;
    state.busy = true;
    setStatus("Exporting frames…");
    render();
    post({ type: "export", ids: state.frames.map((f) => f.id), scale: state.scale });
  });

  async function upload(frames) {
    const base = state.local ? LOCAL : PROD;
    const body = { mode: state.mode, set: state.set, platform: state.platform, frames: frames.map((f) => ({ name: f.name, width: f.width, height: f.height })) };
    const res = await fetch(base + "/api/figma-import", { method: "POST", headers: { "content-type": "application/json" }, body: JSON.stringify(body) });
    const created = await res.json().catch(() => ({}));
    if (!res.ok) throw new Error(created.error || "Mockframe couldn't start the import (" + res.status + ")");
    for (let i = 0; i < frames.length; i++) {
      setStatus("Uploading " + (i + 1) + " of " + frames.length + "…");
      const put = await fetch(base + "/api/figma-import/" + created.id + "/" + i, { method: "PUT", body: frames[i].bytes });
      if (!put.ok) {
        const err = await put.json().catch(() => ({}));
        throw new Error(err.error || "Uploading “" + frames[i].name + "” failed (" + put.status + ")");
      }
    }
    return created.editorUrl;
  }

  function opened(url) {
    state.lastUrl = url;
    const el = $("status");
    el.className = "status";
    el.textContent = "Opened in your browser. ";
    const again = document.createElement("a");
    again.textContent = "Open again";
    again.addEventListener("click", () => post({ type: "open", url }));
    el.appendChild(again);
  }

  window.onmessage = async (event) => {
    const msg = event.data && event.data.pluginMessage;
    if (!msg) return;
    if (msg.type === "selection") {
      state.frames = msg.frames;
      state.more = msg.more;
      if (!state.busy && !state.lastUrl) setStatus("");
      render();
    } else if (msg.type === "prefs" && msg.prefs) {
      Object.assign(state, msg.prefs);
      render();
    } else if (msg.type === "progress") {
      setStatus("Exporting " + (msg.done + 1) + " of " + msg.total + "…");
    } else if (msg.type === "exported") {
      try {
        const url = await upload(msg.frames);
        post({ type: "open", url });
        post({ type: "notify", text: "Opening in Mockframe" });
        opened(url);
      } catch (e) {
        const offline = e instanceof TypeError;
        setStatus(offline ? "Couldn't reach Mockframe. Check your connection and try again." : e && e.message ? e.message : "Sending failed. Try again.", true);
      } finally {
        state.busy = false;
        render();
      }
    } else if (msg.type === "error") {
      state.busy = false;
      setStatus(msg.text, true);
      render();
    }
  };

  render();
  post({ type: "ready" });
</script>
</body>
</html>
